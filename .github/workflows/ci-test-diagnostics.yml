name: CI Test Diagnostics (temporary)

on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write

env:
  DOTNET_VERSION: '8.0.x'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  test-diagnostics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [Debug]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Provide DevelApp.CognitiveGraph package feed
      uses: ./.github/actions/setup-cognitivegraph-feed

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration ${{ matrix.configuration }} --no-restore

    - name: Test
      shell: bash
      run: |
        dotnet --version > sdk-info.txt
        dotnet --list-sdks >> sdk-info.txt
        set +e
        dotnet test --configuration ${{ matrix.configuration }} --no-build --verbosity normal --collect:"XPlat Code Coverage" --logger trx --results-directory ./TestResults 2>&1 | tee test-output.log
        code=${PIPESTATUS[0]}
        echo "DOTNET_TEST_EXIT_CODE=$code" >> sdk-info.txt
        cat sdk-info.txt
        exit $code

    - name: Post diagnostics as PR comment
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.number }}
      run: |
        {
          echo "## 🧪 CI test diagnostics v2 (temporary workflow, ${{ matrix.configuration }})"
          echo ""
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "### SDK info and exit code"
          echo ""
          echo '```'
          cat sdk-info.txt 2>/dev/null
          echo '```'
          echo ""
          echo "### Error/warning/exception lines from full log"
          echo ""
          echo '```'
          grep -n -iE "error|fail|exception|warn|crash|abort" test-output.log 2>/dev/null | head -n 80 || echo "(none found)"
          echo '```'
          echo ""
          echo "### First 60 lines of log"
          echo ""
          echo '```'
          head -n 60 test-output.log 2>/dev/null
          echo '```'
          echo ""
          echo "### Last 60 lines of log"
          echo ""
          echo '```'
          tail -n 60 test-output.log 2>/dev/null
          echo '```'
          echo ""
          for trx in $(find TestResults -name '*.trx' 2>/dev/null); do
            echo "### TRX: $trx"
            echo ""
            total=$(grep -c '<UnitTestResult' "$trx" || true)
            failed=$(perl -0777 -ne 'my $c=0; $c++ while /<UnitTestResult\b[^>]*outcome="Failed"/g; print $c' "$trx")
            passed=$(perl -0777 -ne 'my $c=0; $c++ while /<UnitTestResult\b[^>]*outcome="Passed"/g; print $c' "$trx")
            echo "- Total results: $total, Passed: $passed, Failed: $failed"
            echo ""
            echo "<details><summary>Collector/RunInfos messages</summary>"
            echo ""
            echo '```'
            perl -0777 -ne 'while (/<RunInfo[^>]*outcome="[^"]*Error[^"]*"[^>]*>([\s\S]*?)<\/RunInfo>/g) { my $m=$1; $m =~ s/<[^>]+>/ /g; $m =~ s/\s+/ /g; print substr($m,0,800),"\n---\n"; }' "$trx"
            perl -0777 -ne 'while (/<Collector [^>]*uri="datacollector://microsoft/CodeCoverage"[^>]*>([\s\S]*?)<\/Collector>/g) { my $m=$1; $m =~ s/<[^>]+>/ /g; $m =~ s/\s+/ /g; print substr($m,0,800),"\n---\n"; }' "$trx"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
          done
        } > diag.md
        gh pr comment "$PR_NUMBER" --body-file diag.md --repo "$GITHUB_REPOSITORY" || echo "comment failed"
