name: CD Pipeline

# Package releases follow org decisions DevelApp-ai/DevelApp-Repo-Global#38
# and #73 (incl. the SHA-256 amendment, 2026-11-12). Publishing packs once,
# SIGNs with Certum cloud code signing (SHA-256 fingerprint interface,
# identical on .NET 9/.NET 10 SDKs, no SDK pin), then publishes in the fixed
# #73 order - GitHub Packages -> GitHub Release -> NuGet.org - with loud
# failures (no continue-on-error and no silent skips on the NuGet.org push;
# it is last so it can never block the org feed or the release). PR builds
# never sign (no TOTP window is spent on PR builds).

on:
  push:
    branches: [ main ]
    # Only trigger on main branch pushes, not PRs

env:
  DOTNET_VERSION: '8.0.x'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  calculate-release-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.SemVer }}
      nugetVersion: ${{ steps.gitversion.outputs.NuGetVersionV2 }}
      releaseVersion: ${{ steps.calculate-clean-version.outputs.clean_version }}
      isPrerelease: ${{ steps.gitversion.outputs.PreReleaseTag != '' }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0.10.2
      with:
        versionSpec: '5.x'
        
    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0.10.2
      with:
        useConfigFile: true
        configFilePath: GitVersion.yml
        
    - name: Calculate clean version for releases
      id: calculate-clean-version
      run: |
        # Extract clean version without pre-release suffix for releases
        FULL_VERSION="${{ steps.gitversion.outputs.SemVer }}"
        # Remove any pre-release suffix (everything after the first hyphen)
        CLEAN_VERSION=$(echo "$FULL_VERSION" | sed 's/-.*$//')
        echo "Full version: $FULL_VERSION"
        echo "Clean version: $CLEAN_VERSION"
        echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

  build-release-packages:
    runs-on: ubuntu-latest
    needs: calculate-release-version
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Provide DevelApp.CognitiveGraph package feed
      uses: ./.github/actions/setup-cognitivegraph-feed
        
    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore dependencies
      run: dotnet restore
        
    - name: Build Release packages with clean versions
      run: |
        # Build projects first
        dotnet build --configuration Release --no-restore -p:Version=${{ needs.calculate-release-version.outputs.releaseVersion }}
        
        # Pack with clean version for release
        dotnet pack src/DevelApp.StepLexer/DevelApp.StepLexer.csproj \
          --configuration Release \
          --no-build \
          --output ./nupkg \
          -p:PackageVersion=${{ needs.calculate-release-version.outputs.releaseVersion }} \
          -p:Version=${{ needs.calculate-release-version.outputs.releaseVersion }}
        
        dotnet pack src/DevelApp.StepParser/DevelApp.StepParser.csproj \
          --configuration Release \
          --no-build \
          --output ./nupkg \
          -p:PackageVersion=${{ needs.calculate-release-version.outputs.releaseVersion }} \
          -p:Version=${{ needs.calculate-release-version.outputs.releaseVersion }}
          
        echo "Release packages created:"
        ls -la ./nupkg/
        
    - name: Create local packages folder
      run: |
        mkdir -p ./packages
        cp ./nupkg/*.nupkg ./packages/
        echo "Packages copied to local packages folder:"
        ls -la ./packages/
        
    - name: Upload packages folder artifact
      uses: actions/upload-artifact@v6
      with:
        name: release-packages
        path: ./packages/
        retention-days: 30

  sign-release-packages:
    name: Sign NuGet Packages (Certum cloud)
    runs-on: windows-latest
    needs: [calculate-release-version, build-release-packages]
    if: github.event_name == 'push'
    steps:
    - name: Download packages
      uses: actions/download-artifact@v7
      with:
        name: release-packages
        path: ./packages

    - name: Validate signing inputs
      # Fail fast BEFORE the SimplySign login consumes a TOTP window
      # (values are never echoed).
      shell: pwsh
      env:
        CERTUM_SIMPLYSIGN_USERID: ${{ secrets.CERTUM_SIMPLYSIGN_USERID }}
        CERTUM_SIMPLYSIGN_OTP_URI: ${{ secrets.CERTUM_SIMPLYSIGN_OTP_URI }}
        CERTUM_THUMBPRINT: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
        CERTUM_FINGERPRINT_SHA256: ${{ secrets.CODE_SIGNING_CERT_FINGERPRINT_SHA256 }}
      run: |
        foreach ($name in @('CERTUM_SIMPLYSIGN_USERID','CERTUM_SIMPLYSIGN_OTP_URI','CERTUM_THUMBPRINT','CERTUM_FINGERPRINT_SHA256')) {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
            throw "Missing signing input: $name (org secrets setup, decision #38)"
          }
        }
        $tp = $env:CERTUM_THUMBPRINT -replace '\s',''
        if ($tp -notmatch '^[0-9A-Fa-f]{40}$') { throw 'Certificate thumbprint must be exactly 40 hex characters (CODE_SIGNING_CERT_THUMBPRINT org secret).' }
        $fp = $env:CERTUM_FINGERPRINT_SHA256 -replace '\s',''
        if ($fp -notmatch '^[0-9A-Fa-f]{64}$') { throw 'Certificate fingerprint must be exactly 64 hex characters (CODE_SIGNING_CERT_FINGERPRINT_SHA256 org secret, decision #73 amendment).' }
        $uri = $null
        if (-not [Uri]::TryCreate($env:CERTUM_SIMPLYSIGN_OTP_URI, [UriKind]::Absolute, [ref]$uri) -or
            $uri.Scheme -ne 'otpauth' -or $uri.Host -ne 'totp' -or
            $uri.Query -notmatch '[?&]secret=[A-Za-z2-7]+=*(&|$)') {
          throw 'CERTUM_SIMPLYSIGN_OTP_URI must be the full otpauth://totp provisioning URI (org secrets setup, decision #38).'
        }

    - name: Connect to Certum SimplySign
      # Pinned by full commit SHA; proven by the LocalTaskhandler signing
      # test (run 43089090840, 2026-11-11). Never sees
      # CERTUM_SIMPLYSIGN_PASSWORD - that secret stays dormant.
      uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64
      with:
        certum-username: ${{ secrets.CERTUM_SIMPLYSIGN_USERID }}
        certum-otp-uri: ${{ secrets.CERTUM_SIMPLYSIGN_OTP_URI }}
        certum-key-id: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
        capture-diagnostics: 'false'

    - name: Sign NuGet packages
      # SHA-256 fingerprint interface (decision #73 amendment, 2026-11-12):
      # works identically on .NET 9 and .NET 10 SDKs; no SDK pin needed.
      shell: pwsh
      env:
        CERTUM_FINGERPRINT_SHA256: ${{ secrets.CODE_SIGNING_CERT_FINGERPRINT_SHA256 }}
      run: |
        $fp = ($env:CERTUM_FINGERPRINT_SHA256 -replace '\s','').ToUpperInvariant()
        $packages = @(Get-ChildItem ./packages/*.nupkg)
        if (-not $packages.Count) { throw 'No packages found to sign.' }
        foreach ($p in $packages) {
          dotnet nuget sign $p.FullName --certificate-fingerprint $fp --timestamper http://time.certum.pl
          if ($LASTEXITCODE -ne 0) { throw "Signing failed (exit $LASTEXITCODE): $($p.Name)" }
        }

    - name: Verify signatures (gate)
      # Any invalid signature fails the job and blocks publishing.
      shell: pwsh
      run: |
        foreach ($p in @(Get-ChildItem ./packages/*.nupkg)) {
          dotnet nuget verify $p.FullName
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed (exit $LASTEXITCODE): $($p.Name)" }
        }

    - name: Upload signed packages
      uses: actions/upload-artifact@v7
      with:
        name: release-packages-signed
        path: ./packages/*.nupkg

  publish-nuget-org:
    runs-on: ubuntu-latest
    # NuGet.org is LAST per org decision #73 (GitHub Packages -> GitHub
    # Release -> NuGet.org), gated on the sign job.
    needs: [calculate-release-version, build-release-packages, sign-release-packages, publish-github-packages, create-github-release]
    environment: production
    permissions:
      contents: write
      id-token: write # OIDC token issuance for NuGet trusted publishing
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        
    - name: Download signed release packages
      uses: actions/download-artifact@v7
      with:
        name: release-packages-signed
        path: ./packages
        
    - name: Check release conditions
      id: release_check
      run: |
        echo "Checking release conditions..."
        
        # Get the clean release version (e.g., "1.0.1")
        CLEAN_VERSION="${{ needs.calculate-release-version.outputs.releaseVersion }}"
        echo "Clean release version: $CLEAN_VERSION"
        
        # Check if this is a semantic version release (not a pre-release like 0.x.x)
        # We should release if we have a clean version like 1.0.1, 1.1.0, etc.
        if [[ "$CLEAN_VERSION" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
          IS_RELEASE_VERSION="true"
          echo "Is release version (1.x.x or higher): true"
        else
          IS_RELEASE_VERSION="false"
          echo "Is release version (1.x.x or higher): false"
        fi
        
        # Check if this is the first release (no existing tags)
        if ! git tag -l | grep -q .; then
          IS_FIRST_RELEASE="true"
          echo "First release detected: true"
        else
          IS_FIRST_RELEASE="false"
          echo "First release detected: false"
        fi
        
        # Determine if we should proceed with release
        # Release if: we have a release version (1.x.x+) OR this is the first release
        if [[ "$IS_RELEASE_VERSION" == "true" || "$IS_FIRST_RELEASE" == "true" ]]; then
          SHOULD_RELEASE="true"
          echo "Should create release: true"
        else
          SHOULD_RELEASE="false"
          echo "Should create release: false (not a release version and not first release)"
        fi
        
        echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
        echo "is_release_version=$IS_RELEASE_VERSION" >> $GITHUB_OUTPUT
        echo "is_first_release=$IS_FIRST_RELEASE" >> $GITHUB_OUTPUT
        echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT
        
    - name: NuGet.org login (OIDC -> temp API key)
      # Trusted publishing (org standard; the long-lived NUGET_API_KEY secret is
      # gone): this job's GitHub OIDC token is exchanged for a ~1-hour nuget.org
      # API key, validated against the trusted publishing policy registered on
      # nuget.org for this repository + workflow:
      #   Repository Owner: DevelApp-ai
      #   Repository:      ENFAStepLexer-StepParser
      #   Workflow File:   cd.yml
      #   Environment:     production (the policy must name the production environment)
      # NUGET_USER = the nuget.org profile name of the owning account (NOT an
      # email address). The login runs close to the push (the temp key is
      # short-lived). Fails loudly if the policy is not (yet) registered.
      id: nuget-login
      if: steps.release_check.outputs.should_release == 'true'
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish to NuGet.org (loud failure per #73 - never silently skipped)
      if: steps.release_check.outputs.should_release == 'true'
      run: |
        # Check which type of release this is
        if [[ "${{ steps.release_check.outputs.is_first_release }}" == "true" ]]; then
          echo "First release detected - publishing initial NuGet packages with clean version"
        else
          echo "Subsequent release detected - using standard publishing with clean version"
        fi
        
        echo "Publishing packages with clean version ${{ needs.calculate-release-version.outputs.releaseVersion }}:"
        ls -la ./packages/
        
        for package in ./packages/*.nupkg; do
          echo "Publishing $package to NuGet.org..."
          # Keyless trusted-publishing key from the login step above.
          dotnet nuget push "$package" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --skip-duplicate
        done
        
  publish-github-packages:
    runs-on: ubuntu-latest
    # GitHub Packages first per org decision #73, gated on the sign job.
    needs: [calculate-release-version, build-release-packages, sign-release-packages]
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Download signed release packages
      uses: actions/download-artifact@v7
      with:
        name: release-packages-signed
        path: ./packages
        
    - name: Set up NuGet authentication for GitHub Packages
      run: |
        dotnet nuget add source \
          --username ${{ github.actor }} \
          --password ${{ secrets.GITHUB_TOKEN }} \
          --store-password-in-clear-text \
          --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          
    - name: Publish release packages to GitHub Packages
      run: |
        RELEASE_VERSION="${{ needs.calculate-release-version.outputs.releaseVersion }}"
        
        echo "Publishing release packages to GitHub Packages:"
        echo "  Release Version: $RELEASE_VERSION"
        echo "  Event: push to main (merged PR)"
        echo ""
        echo "📦 Publishing RELEASE packages to GitHub Packages:"
        ls -la ./packages/
        
        for package in ./packages/*.nupkg; do
          echo "Publishing $package to GitHub Packages..."
          dotnet nuget push "$package" \
            --source github \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
        done
        
        echo "✅ Release package publishing complete!"

  create-github-release:
    runs-on: ubuntu-latest
    # GitHub Release second per org decision #73 (after GitHub Packages,
    # before NuGet.org), gated on the sign job.
    needs: [calculate-release-version, build-release-packages, sign-release-packages, publish-github-packages]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    
    - name: Download signed release packages
      uses: actions/download-artifact@v7
      with:
        name: release-packages-signed
        path: ./packages
        
    - name: List available packages
      run: |
        echo "📦 Available packages for release:"
        ls -la ./packages/
      
    - name: Check release conditions
      id: release_check
      run: |
        echo "Checking release conditions..."
        
        # Get the clean release version (e.g., "1.0.1")
        CLEAN_VERSION="${{ needs.calculate-release-version.outputs.releaseVersion }}"
        echo "Clean release version: $CLEAN_VERSION"
        
        # Check if this is a semantic version release (not a pre-release like 0.x.x)
        # We should release if we have a clean version like 1.0.1, 1.1.0, etc.
        if [[ "$CLEAN_VERSION" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
          IS_RELEASE_VERSION="true"
          echo "Is release version (1.x.x or higher): true"
        else
          IS_RELEASE_VERSION="false"
          echo "Is release version (1.x.x or higher): false"
        fi
        
        # Check if this is the first release (no existing tags)
        if ! git tag -l | grep -q .; then
          IS_FIRST_RELEASE="true"
          echo "First release detected: true"
        else
          IS_FIRST_RELEASE="false"
          echo "First release detected: false"
        fi
        
        # Determine if we should proceed with release
        # Release if: we have a release version (1.x.x+) OR this is the first release
        if [[ "$IS_RELEASE_VERSION" == "true" || "$IS_FIRST_RELEASE" == "true" ]]; then
          SHOULD_RELEASE="true"
          echo "Should create release: true"
        else
          SHOULD_RELEASE="false"
          echo "Should create release: false (not a release version and not first release)"
        fi
        
        echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
        echo "is_release_version=$IS_RELEASE_VERSION" >> $GITHUB_OUTPUT
        echo "is_first_release=$IS_FIRST_RELEASE" >> $GITHUB_OUTPUT
        echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT
      
    - name: Create GitHub Release
      if: steps.release_check.outputs.should_release == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Use the clean release version for tagging
        RELEASE_VERSION="${{ needs.calculate-release-version.outputs.releaseVersion }}"
        echo "Creating release for clean version: $RELEASE_VERSION"
        
        # Check if tag already exists
        if git tag -l | grep -q "^v$RELEASE_VERSION$"; then
          TAG_EXISTS="true"
          echo "Tag v$RELEASE_VERSION already exists"
        else
          TAG_EXISTS="false"
          echo "Tag v$RELEASE_VERSION does not exist"
        fi
        
        # Check if release already exists  
        if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
          RELEASE_EXISTS="true"
          echo "Release v$RELEASE_VERSION already exists"
        else
          RELEASE_EXISTS="false"
          echo "Release v$RELEASE_VERSION does not exist"
        fi
        
        # Handle tag creation
        if [[ "$TAG_EXISTS" == "false" ]]; then
          echo "Creating new tag v$RELEASE_VERSION"
          git tag "v$RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"
        else
          echo "Tag v$RELEASE_VERSION already exists, skipping tag creation"
        fi
        
        # Handle release creation/update
        if [[ "$RELEASE_EXISTS" == "false" ]]; then
          echo "Creating new release v$RELEASE_VERSION"
          
          if [[ "${{ steps.release_check.outputs.is_first_release }}" == "true" ]]; then
            echo "First release detected - creating initial release"
            RELEASE_NOTES="## Changes in v$RELEASE_VERSION
          
          ### New Package Architecture
          - 📦 **DevelApp.StepLexer** - Advanced UTF-8 tokenization with multi-path support
          - 📦 **DevelApp.StepParser** - GLR-style multi-path parsing with CognitiveGraph integration
          
          ### GrammarForge Step-Parser Features
          - ✨ StepLexer with unified regex pattern parsing and source tokenization
          - ⚡ StepParser with GLR-style incremental parsing for ambiguity resolution
          - 🔗 CognitiveGraph integration for advanced semantic analysis  
          - 🎯 Context-sensitive grammar support with hierarchical scopes
          - 🔧 Location-based refactoring operations (extract, inline, rename)
          - 📝 Grammar inheritance with ANTLR/Bison/Yacc base grammar support
          - 💾 Zero-copy UTF-8 processing with ReadOnlyMemory support
          - 🔀 Multi-path tokenization for handling ambiguous input
          
          ### Breaking Changes
          - Replaced single ENFAStepLexer.StepParser package with split architecture
          - Updated namespace from ENFA_Parser.Core to DevelApp.StepLexer/DevelApp.StepParser
          - Integrated AST functionality with DevelApp.CognitiveGraph
          
          See the [CHANGELOG](CHANGELOG.md) for detailed changes."
          else
            echo "Subsequent release detected - using standard release notes"
            RELEASE_NOTES="## Changes in v$RELEASE_VERSION
          
          ### Package Updates
          - 📦 **DevelApp.StepLexer** v$RELEASE_VERSION - Advanced UTF-8 tokenization
          - 📦 **DevelApp.StepParser** v$RELEASE_VERSION - GLR-style multi-path parsing
          
          See the [CHANGELOG](CHANGELOG.md) for detailed changes."
          fi
          
          # Create the GitHub release
          gh release create "v$RELEASE_VERSION" \
            --title "Release v$RELEASE_VERSION" \
            --notes "$RELEASE_NOTES" \
            --target main \
            ./packages/*.nupkg
        else
          echo "Release v$RELEASE_VERSION already exists - updating with clean packages"
          
          # Upload the clean packages to the existing release
          gh release upload "v$RELEASE_VERSION" ./packages/*.nupkg --clobber
          
          echo "✅ Updated release v$RELEASE_VERSION with clean packages:"
          ls -la ./packages/
          
          # Update release notes to indicate clean packages
          gh release edit "v$RELEASE_VERSION" \
            --notes "## Release v$RELEASE_VERSION - Clean Packages Available
          
          🎉 **Updated with clean release packages (without CI suffixes)**
          
          ### Package Architecture
          - 📦 **DevelApp.StepLexer** v$RELEASE_VERSION - Advanced UTF-8 tokenization with multi-path support
          - 📦 **DevelApp.StepParser** v$RELEASE_VERSION - GLR-style multi-path parsing with CognitiveGraph integration
          
          ### GrammarForge Step-Parser Features
          - ✨ StepLexer with unified regex pattern parsing and source tokenization
          - ⚡ StepParser with GLR-style incremental parsing for ambiguity resolution
          - 🔗 CognitiveGraph integration for advanced semantic analysis  
          - 🎯 Context-sensitive grammar support with hierarchical scopes
          - 🔧 Location-based refactoring operations (extract, inline, rename)
          - 📝 Grammar inheritance with ANTLR/Bison/Yacc base grammar support
          - 💾 Zero-copy UTF-8 processing with ReadOnlyMemory support
          - 🔀 Multi-path tokenization for handling ambiguous input
          
          ### Breaking Changes
          - Replaced single ENFAStepLexer.StepParser package with split architecture
          - Updated namespace from ENFA_Parser.Core to DevelApp.StepLexer/DevelApp.StepParser
          - Integrated AST functionality with DevelApp.CognitiveGraph
          
          See the [CHANGELOG](CHANGELOG.md) for detailed changes."
        fi