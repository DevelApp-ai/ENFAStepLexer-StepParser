name: ML-Assist Training Pipeline

# Automates issue #93 (sub-issue of #58): captures training labels from the
# Minotaur-Grammars corpus, trains the #74/#75 model artifacts with
# tools/ml-assist/train.py, evaluates zero-semantic-change + end-to-end
# improvement (against the ML-off arm, see docs/ml-baseline for the #73
# baseline) and writes the measurement report.
#
# DELIBERATELY MANUAL-ONLY (maintainer request, 2026-11-17): a full run
# spends 21+ minutes - and in practice 120+ minutes - in corpus label
# capture alone, so this workflow has NO automatic triggers: no push, no
# pull_request, no schedule. Do not add them back. Run it explicitly from
# the Actions tab:
#   - workflow_dispatch: retrain on demand (e.g. after a corpus refresh);
#     set commit_results=false to only upload artifacts without committing.
# The 300m timeout is safe precisely because the run is manual - cancel
# any dispatch that turns out to be pathologically slow.
#
# Manual command equivalents are documented in docs/ML-Assist.md.

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: 'Version stamped on the trained artifacts (semver)'
        required: false
        default: '0.2.0'
      commit_results:
        description: 'Commit trained artifacts + measurement report back to the branch'
        type: boolean
        required: false
        default: true
env:
  DOTNET_VERSION: '8.0.x'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  MODEL_VERSION: ${{ inputs.model_version }}
  COMMIT_RESULTS: ${{ inputs.commit_results }}

jobs:
  train-and-measure:
    name: Train #74/#75 models and measure (#93)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 300
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Checkout Minotaur-Grammars (training corpus)
      uses: actions/checkout@v5
      with:
        repository: DevelApp-ai/Minotaur-Grammars
        path: grammars
        ref: main

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Provide DevelApp.CognitiveGraph package feed
      uses: ./.github/actions/setup-cognitivegraph-feed

    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build (Release)
      run: dotnet build --configuration Release --no-restore

    - name: Capture training labels (#92/"93)
      env:
        MINOTAUR_GRAMMARS_DIR: ${{ github.workspace }}/grammars
        ML_TRACE_OUT: ${{ runner.temp }}/ml-labels
      run: >
        dotnet test src/DevelApp.StepParser.Tests/DevelApp.StepParser.Tests.csproj
        --configuration Release --no-build
        --filter "FullyQualifiedName~MlLabel"
        --logger trx --results-directory ./TestResults-MlLabel

    - name: Train rule prioritizer (#74)
      run: >
        python3 tools/ml-assist/train.py rule
        ${{ runner.temp }}/ml-labels/ml-rule-labels.jsonl
        --version ${MODEL_VERSION}
        --out docs/ml-assist/artifacts/rule-prioritizer.json

    - name: Train path pruner (#75)
      run: >
        python3 tools/ml-assist/train.py path
        ${{ runner.temp }}/ml-labels/ml-path-labels.jsonl
        --version ${MODEL_VERSION}
        --out docs/ml-assist/artifacts/path-pruner.json

    - name: Evaluate zero-semantic-change and end-to-end (#93)
      env:
        MINOTAUR_GRAMMARS_DIR: ${{ github.workspace }}/grammars
        ML_EVAL_OUT: ${{ runner.temp }}/ml-eval
      run: >
        dotnet test src/DevelApp.StepParser.Tests/DevelApp.StepParser.Tests.csproj
        --configuration Release --no-build
        --filter "FullyQualifiedName~MlAssistEvaluation"
        --logger trx --results-directory ./TestResults-MlEval

    - name: Write measurement report (#93 definition of done)
      run: |
        CORPUS_REF="main@$(git -C grammars rev-parse --short HEAD)"
        echo "Corpus: Minotaur-Grammars ${CORPUS_REF}"
        mkdir -p docs/ml-assist/reports
        python3 tools/ml-assist/train.py summarize-eval \
          ${{ runner.temp }}/ml-eval/ml-assist-evaluation.csv
        python3 tools/ml-assist/train.py report-eval \
          ${{ runner.temp }}/ml-eval/ml-assist-evaluation.csv \
          --rule-artifact docs/ml-assist/artifacts/rule-prioritizer.json \
          --path-artifact docs/ml-assist/artifacts/path-pruner.json \
          --corpus-ref "${CORPUS_REF}" \
          --out docs/ml-assist/reports/measurement-report-v${MODEL_VERSION}.md

    - name: Commit trained artifacts + measurement report
      if: env.COMMIT_RESULTS == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add docs/ml-assist/artifacts docs/ml-assist/reports
        if git diff --staged --quiet; then
          echo "No changes to comit."
          exit 0
        fi
        git commit -m "Train ML-assist artifacts v${MODEL_VERSION} on Minotaur-Grammars main and record the #93 measurement report (refs #58, #74, #75, #93)"
        git push

    - name: Acceptance gate (#58 definition of done)
      # Re-run report-eval without --out so the exit code decides the job:
      #   0 = zero semantic changes AND end-to-end improvement
      #   1 = semantic divergence (contract breach)
      #   2 = no end-to-end improvement
      run: >
        python3 tools/ml-assist/train.py report-eval
        ${{ runner.temp }}/ml-eval/ml-assist-evaluation.csv
        --rule-artifact docs/ml-assist/artifacts/rule-prioritizer.json
        --path-artifact docs/ml-assist/artifacts/path-pruner.json

    - name: Upload training outputs
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: ml-assist-training-outputs
        path: |
          ${{ runner.temp }}/ml-labels
          ${{ runner.temp }}/ml-eval
          docs/ml-assist/artifacts
          docs/ml-assist/reports
          TestResults-MlLabel
          TestResults-MlEval
