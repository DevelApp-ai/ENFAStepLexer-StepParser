name: CI Pipeline

# Package releases follow org decisions DevelApp-ai/DevelApp-Repo-Global#38
# and #73 (incl. the SHA-256 amendment, 2026-11-12). Publishing packs once,
# SIGNs with Certum cloud code signing (SHA-256 fingerprint interface,
# identical on .NET 9/.NET 10 SDKs, no SDK pin), then publishes in the fixed
# #73 order - GitHub Packages -> GitHub Release -> NuGet.org - with loud
# failures (no continue-on-error and no silent skips on the NuGet.org push;
# it is last so it can never block the org feed or the release). PR builds
# never sign (no TOTP window is spent on PR builds).

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, ready_for_review]

env:
  DOTNET_VERSION: '8.0.x'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  calculate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.SemVer }}
      nugetVersion: ${{ steps.final-version.outputs.final_nuget_version }}
      isPrerelease: ${{ steps.final-version.outputs.is_prerelease }}
      versionType: ${{ steps.final-version.outputs.version_type }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0.10.2
      with:
        versionSpec: '5.x'
        
    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0.10.2
      with:
        useConfigFile: true
        configFilePath: GitVersion.yml
        
    - name: Determine final version based on PR context
      id: final-version
      run: |
        BASE_VERSION="${{ steps.gitversion.outputs.SemVer }}"
        NUGET_VERSION="${{ steps.gitversion.outputs.NuGetVersionV2 }}"
        
        # Determine version type and appropriate tagging based on context
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          TARGET_BRANCH="${{ github.base_ref }}"
          PR_NUMBER="${{ github.event.number }}"
          
          echo "Pull Request Context:"
          echo "  Target Branch: $TARGET_BRANCH"
          echo "  PR Number: $PR_NUMBER"
          echo "  Base Version: $BASE_VERSION"
          
          if [[ "$TARGET_BRANCH" == "main" ]]; then
            # PR targeting main → beta version
            CLEAN_VERSION=$(echo "$BASE_VERSION" | sed 's/-.*$//')
            FINAL_VERSION="${CLEAN_VERSION}-beta.${PR_NUMBER}"
            VERSION_TYPE="beta"
            echo "PR to main: Using beta version $FINAL_VERSION"
          else
            # PR targeting other branches → alpha version  
            CLEAN_VERSION=$(echo "$BASE_VERSION" | sed 's/-.*$//')
            FINAL_VERSION="${CLEAN_VERSION}-alpha.${PR_NUMBER}"
            VERSION_TYPE="alpha"
            echo "PR to $TARGET_BRANCH: Using alpha version $FINAL_VERSION"
          fi
          
          IS_PRERELEASE="true"
        else
          # Direct push to branch - use GitVersion output as-is
          FINAL_VERSION="$NUGET_VERSION"
          if [[ "${{ steps.gitversion.outputs.PreReleaseTag }}" != "" ]]; then
            IS_PRERELEASE="true"
            VERSION_TYPE="ci"
          else
            IS_PRERELEASE="false" 
            VERSION_TYPE="release"
          fi
          echo "Direct push: Using GitVersion output $FINAL_VERSION"
        fi
        
        echo "Final version calculation:"
        echo "  Base Version: $BASE_VERSION"
        echo "  Final Version: $FINAL_VERSION"
        echo "  Is Prerelease: $IS_PRERELEASE"
        echo "  Version Type: $VERSION_TYPE"
        
        echo "final_nuget_version=$FINAL_VERSION" >> $GITHUB_OUTPUT
        echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
        echo "version_type=$VERSION_TYPE" >> $GITHUB_OUTPUT

  build-and-test:
    runs-on: ubuntu-latest
    needs: calculate-version
    permissions:
      contents: read
    strategy:
      matrix:
        configuration: [Debug, Release]
    
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Provide DevelApp.CognitiveGraph package feed
      uses: ./.github/actions/setup-cognitivegraph-feed
        
    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --configuration ${{ matrix.configuration }} --no-restore -p:Version=${{ needs.calculate-version.outputs.version }}
      
    - name: Test
      run: dotnet test --configuration ${{ matrix.configuration }} --no-build --verbosity normal --collect:"XPlat Code Coverage" --logger trx --results-directory ./TestResults
      
    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-results-${{ matrix.configuration }}
        path: ./TestResults
        
    - name: Pack NuGet packages with appropriate versioning
      if: matrix.configuration == 'Release'
      run: |
        VERSION_TYPE="${{ needs.calculate-version.outputs.versionType }}"
        PACKAGE_VERSION="${{ needs.calculate-version.outputs.nugetVersion }}"
        
        echo "Packing packages:"
        echo "  Version Type: $VERSION_TYPE" 
        echo "  Package Version: $PACKAGE_VERSION"
        
        # Pack DevelApp.StepLexer
        dotnet pack src/DevelApp.StepLexer/DevelApp.StepLexer.csproj \
          --configuration Release \
          --no-build \
          --output ./nupkg \
          -p:PackageVersion=$PACKAGE_VERSION \
          -p:Version=${{ needs.calculate-version.outputs.version }}
        
        # Pack DevelApp.StepParser  
        dotnet pack src/DevelApp.StepParser/DevelApp.StepParser.csproj \
          --configuration Release \
          --no-build \
          --output ./nupkg \
          -p:PackageVersion=$PACKAGE_VERSION \
          -p:Version=${{ needs.calculate-version.outputs.version }}
          
        echo "Generated packages:"
        ls -la ./nupkg/
          
    - name: Upload CI NuGet packages
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v6
      with:
        name: ci-nuget-packages
        path: ./nupkg/*.nupkg

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Provide DevelApp.CognitiveGraph package feed
      uses: ./.github/actions/setup-cognitivegraph-feed
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Security scan
      run: |
        dotnet list package --vulnerable --include-transitive || true
        dotnet list package --deprecated || true

  sign-ci-packages:
    name: Sign NuGet Packages (Certum cloud)
    runs-on: windows-latest
    needs: [calculate-version, build-and-test]
    if: github.event_name == 'push'
    steps:
    - name: Download packages
      uses: actions/download-artifact@v7
      with:
        name: ci-nuget-packages
        path: ./nupkg

    - name: Validate signing inputs
      # Fail fast BEFORE the SimplySign login consumes a TOTP window
      # (values are never echoed).
      shell: pwsh
      env:
        CERTUM_SIMPLYSIGN_USERID: ${{ secrets.CERTUM_SIMPLYSIGN_USERID }}
        CERTUM_SIMPLYSIGN_OTP_URI: ${{ secrets.CERTUM_SIMPLYSIGN_OTP_URI }}
        CERTUM_THUMBPRINT: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
        CERTUM_FINGERPRINT_SHA256: ${{ secrets.CODE_SIGNING_CERT_FINGERPRINT_SHA256 }}
      run: |
        foreach ($name in @('CERTUM_SIMPLYSIGN_USERID','CERTUM_SIMPLYSIGN_OTP_URI','CERTUM_THUMBPRINT','CERTUM_FINGERPRINT_SHA256')) {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
            throw "Missing signing input: $name (org secrets setup, decision #38)"
          }
        }
        $tp = $env:CERTUM_THUMBPRINT -replace '\s',''
        if ($tp -notmatch '^[0-9A-Fa-f]{40}$') { throw 'Certificate thumbprint must be exactly 40 hex characters (CODE_SIGNING_CERT_THUMBPRINT org secret).' }
        $fp = $env:CERTUM_FINGERPRINT_SHA256 -replace '\s',''
        if ($fp -notmatch '^[0-9A-Fa-f]{64}$') { throw 'Certificate fingerprint must be exactly 64 hex characters (CODE_SIGNING_CERT_FINGERPRINT_SHA256 org secret, decision #73 amendment).' }
        $uri = $null
        if (-not [Uri]::TryCreate($env:CERTUM_SIMPLYSIGN_OTP_URI, [UriKind]::Absolute, [ref]$uri) -or
            $uri.Scheme -ne 'otpauth' -or $uri.Host -ne 'totp' -or
            $uri.Query -notmatch '[?&]secret=[A-Za-z2-7]+=*(&|$)') {
          throw 'CERTUM_SIMPLYSIGN_OTP_URI must be the full otpauth://totp provisioning URI (org secrets setup, decision #38).'
        }

    - name: Connect to Certum SimplySign
      # Pinned by full commit SHA; proven by the LocalTaskhandler signing
      # test (run 43089090840, 2026-11-11). Never sees
      # CERTUM_SIMPLYSIGN_PASSWORD - that secret stays dormant.
      uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64
      with:
        certum-username: ${{ secrets.CERTUM_SIMPLYSIGN_USERID }}
        certum-otp-uri: ${{ secrets.CERTUM_SIMPLYSIGN_OTP_URI }}
        certum-key-id: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
        capture-diagnostics: 'false'

    - name: Sign NuGet packages
      # SHA-256 fingerprint interface (decision #73 amendment, 2026-11-12):
      # works identically on .NET 9 and .NET 10 SDKs; no SDK pin needed.
      shell: pwsh
      env:
        CERTUM_FINGERPRINT_SHA256: ${ secrets.CODE_SIGNING_CERT_FINGERPRINT_SHA256 }
      run: |
        $fp = ($env:CERTUM_FINGERPRINT_SHA256 -replace '\s','').ToUpperInvariant()
        $packages = @(Get-ChildItem ./nupkg/*.nupkg)
        if (-not $packages.Count) { throw 'No packages found to sign.' }
        foreach ($p in $packages) {
          dotnet nuget sign $p.FullName --certificate-fingerprint $fp --timestamper http://time.certum.pl
          if ($LASTEXITCODE -ne 0) { throw "Signing failed (exit $LASTEXITCODE): $($p.Name)" }
        }

    - name: Verify signatures (gate)
      # Any invalid signature fails the job and blocks publishing.
      shell: pwsh
      run: |
        foreach ($p in @(Get-ChildItem ./nupkg/*.nupkg)) {
          dotnet nuget verify $p.FullName
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed (exit $LASTEXITCODE): $($p.Name)" }
        }

    - name: Upload signed packages
      uses: actions/upload-artifact@v7
      with:
        name: ci-nuget-packages-signed
        path: ./nupkg/*.nupkg

  publish-github-packages:
    # Signed CI packages from branch pushes (Certum cloud, decision #38/#73).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [calculate-version, build-and-test, security-scan, sign-ci-packages]
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${ env.DOTNET_VERSION }
        
    - name: Download ci-nuget-packages-signed
      uses: actions/download-artifact@v7
      with:
        name: ci-nuget-packages-signed
        path: ./nupkg
        
    - name: Set up NuGet authentication
      run: |
        dotnet nuget add source \
          --username ${ github.actor } \
          --password ${ secrets.GITHUB_TOKEN } \
          --store-password-in-clear-text \
          --name github "https://nuget.pkg.github.com/${ github.repository_owner }/index.json"
          
    - name: Publish to GitHub Packages
      run: |
        VERSION_TYPE="${ needs.calculate-version.outputs.versionType }"
        PACKAGE_VERSION="${ needs.calculate-version.outputs.nugetVersion }"
        
        echo "Publishing packages to GitHub Packages:"
        echo "  Version Type: $VERSION_TYPE"
        echo "  Package Version: $PACKAGE_VERSION" 
        echo "  Event: ${ github.event_name }"
        
        for package in ./nupkg/*.nupkg; do
          echo "Publishing $package to GitHub Packages..."
          dotnet nuget push "$package" \
            --source github \
            --api-key ${ secrets.GITHUB_TOKEN } \
            --skip-duplicate || echo "Package already exists, skipping..."
        done
        
        echo "Package publishing complete!"
        ls -la ./nupkg/

  publish-github-packages-pr:
    # PR-triggered alpha/beta packages stay unsigned and go to GitHub
    # Packages only - per the wave-2 rule, PR builds never consume a
    # TOTP signing window. They are never published to NuGet.org.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [calculate-version, build-and-test, security-scan]
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${ env.DOTNET_VERSION }
        
    - name: Download ci-nuget-packages
      uses: actions/download-artifact@v7
      with:
        name: ci-nuget-packages
        path: ./nupkg
        
    - name: Set up NuGet authentication
      run: |
        dotnet nuget add source \
          --username ${ github.actor } \
          --password ${ secrets.GITHUB_TOKEN } \
          --store-password-in-clear-text \
          --name github "https://nuget.pkg.github.com/${ github.repository_owner }/index.json"
          
    - name: Publish to GitHub Packages
      run: |
        VERSION_TYPE="${ needs.calculate-version.outputs.versionType }"
        PACKAGE_VERSION="${ needs.calculate-version.outputs.nugetVersion }"
        
        echo "Publishing packages to GitHub Packages:"
        echo "  Version Type: $VERSION_TYPE"
        echo "  Package Version: $PACKAGE_VERSION" 
        echo "  Event: ${ github.event_name }"
        
        for package in ./nupkg/*.nupkg; do
          echo "Publishing $package to GitHub Packages..."
          dotnet nuget push "$package" \
            --source github \
            --api-key ${ secrets.GITHUB_TOKEN } \
            --skip-duplicate || echo "Package already exists, skipping..."
        done
        
        echo "Package publishing complete!"
        ls -la ./nupkg/
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Download CI NuGet packages
      uses: actions/download-artifact@v7
      with:
        name: ci-nuget-packages
        path: ./nupkg
        
    - name: Set up NuGet authentication
      run: |
        dotnet nuget add source \
          --username ${{ github.actor }} \
          --password ${{ secrets.GITHUB_TOKEN }} \
          --store-password-in-clear-text \
          --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          
    - name: Publish to GitHub Packages
      run: |
        VERSION_TYPE="${{ needs.calculate-version.outputs.versionType }}"
        PACKAGE_VERSION="${{ needs.calculate-version.outputs.nugetVersion }}"
        
        echo "Publishing packages to GitHub Packages:"
        echo "  Version Type: $VERSION_TYPE"
        echo "  Package Version: $PACKAGE_VERSION" 
        echo "  Event: ${{ github.event_name }}"
        
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          TARGET_BRANCH="${{ github.base_ref }}"
          if [[ "$TARGET_BRANCH" == "main" ]]; then
            echo "📦 Publishing BETA packages (PR to main) to GitHub Packages"
          else
            echo "📦 Publishing ALPHA packages (PR to $TARGET_BRANCH) to GitHub Packages"
          fi
        else
          echo "📦 Publishing CI packages (direct push) to GitHub Packages"
        fi
        
        for package in ./nupkg/*.nupkg; do
          echo "Publishing $package to GitHub Packages..."
          dotnet nuget push "$package" \
            --source github \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate || echo "Package already exists, skipping..."
        done
        
        echo "✅ Package publishing complete!"
        echo "📦 Published packages:"
        ls -la ./nupkg/